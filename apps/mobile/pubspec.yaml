name: smartwear
description: "SmartWear — fashion & beauty, delivered."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  cached_network_image: ^4.0.6
  thumbhash: ^0.1.0+1
  google_maps_flutter: ^2.19.0
  geolocator: ^14.1.2
  google_sign_in: ^7.2.0
  intl: ^0.20.2
  web_socket_channel: ^3.0.3
  sms_autofill: ^2.6.1
  just_audio: ^0.10.6
  video_player: ^2.14.1
  url_launcher: ^6.3.3
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: false
  assets:
    - assets/brand/
  fonts:
    - family: Lucide300
      fonts:
        - asset: assets/fonts/Lucide300.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-300.ttf
          weight: 300
        - asset: assets/fonts/Fraunces-300-italic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Fraunces-400.ttf
          weight: 400
        - asset: assets/fonts/Fraunces-500.ttf
          weight: 500
        - asset: assets/fonts/Fraunces-600.ttf
          weight: 600
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
